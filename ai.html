<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة الضبع - التحدث مع ضبع AI</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            background: radial-gradient(circle at center, #064e3b, #022c22, #000000);
            font-family: 'Cairo', sans-serif;
            color: #f0fdf4;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 90vh;
        }
        .chat-container {
            width: 100%;
            max-width: 650px;
            background: rgba(6, 78, 59, 0.6);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(34, 197, 94, 0.4);
            border-radius: 20px;
            box-shadow: 0 0 35px rgba(34, 197, 94, 0.3);
            padding: 25px;
            box-sizing: border-box;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            border-bottom: 1px solid rgba(34, 197, 94, 0.2);
            padding-bottom: 15px;
        }
        .header h2 {
            margin: 0;
            color: #4ade80;
            font-size: 22px;
            text-shadow: 0 0 10px rgba(74, 222, 128, 0.6);
        }
        .back-btn {
            background: linear-gradient(135deg, #22c55e, #15803d);
            color: white;
            text-decoration: none;
            padding: 8px 18px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: bold;
            transition: 0.3s;
            box-shadow: 0 0 10px rgba(34, 197, 94, 0.3);
        }
        .back-btn:hover {
            opacity: 0.9;
            transform: translateY(-2px);
        }
        .chat-box {
            height: 350px;
            overflow-y: auto;
            background: rgba(2, 44, 34, 0.7);
            border: 1px solid rgba(34, 197, 94, 0.3);
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 15px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .message {
            padding: 10px 14px;
            border-radius: 10px;
            max-width: 85%;
            line-height: 1.6;
            word-wrap: break-word;
            font-size: 15px;
        }
        .user-message {
            background: rgba(34, 197, 94, 0.2);
            color: #f0fdf4;
            align-self: flex-start;
            border: 1px solid rgba(34, 197, 94, 0.4);
            border-bottom-right-radius: 0;
        }
        .ai-message {
            background: rgba(6, 78, 59, 0.5);
            color: #4ade80;
            align-self: flex-end;
            border: 1px solid rgba(34, 197, 94, 0.3);
            border-bottom-left-radius: 0;
        }
        .input-group {
            display: flex;
            gap: 10px;
        }
        input[type="text"] {
            flex: 1;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid rgba(34, 197, 94, 0.4);
            background: rgba(2, 44, 34, 0.9);
            color: #ffffff;
            font-family: 'Cairo', sans-serif;
            font-size: 15px;
            outline: none;
        }
        input[type="text"]:focus {
            border-color: #4ade80;
            box-shadow: 0 0 10px rgba(74, 222, 128, 0.4);
        }
        button {
            padding: 12px 20px;
            background: linear-gradient(135deg, #22c55e, #15803d);
            color: white;
            font-weight: bold;
            font-family: 'Cairo', sans-serif;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 15px;
            box-shadow: 0 0 15px rgba(34, 197, 94, 0.4);
            transition: 0.3s;
        }
        button:hover {
            opacity: 0.9;
            transform: translateY(-2px);
        }
    </style>
</head>
<body>

<div class="chat-container">
    <div class="header">
        <h2>🤖 التحدث مع ضبع AI</h2>
        <a href="/" class="back-btn">⬅ لوحة التحكم</a>
    </div>

    <div class="chat-box" id="chatBox">
        <div class="message ai-message">
            <strong>ضبع AI:</strong> أهلاً بك! أنا مدعوم بـ Google Gemini ومستعد لمساعدتك.
        </div>
    </div>

    <div class="input-group">
        <input type="text" id="userInput" placeholder="اكتب رسالتك هنا..." onkeypress="handleKeyPress(event)">
        <button onclick="sendMessage()">إرسال الرسالة</button>
    </div>
</div>

<script>
    async function sendMessage() {
        const inputField = document.getElementById('userInput');
        const chatBox = document.getElementById('chatBox');
        const prompt = inputField.value.trim();

        // 🛑 التحقق من أن الرسالة صحيحة وليست فارغة أو قصيرة جدًا
        if (!prompt || prompt.length < 2) {
            alert("الرجاء كتابة رسالة صحيحة وذات معنى (حرفين على الأقل).");
            return;
        }

        const userMsgDiv = document.createElement('div');
        userMsgDiv.className = 'message user-message';
        userMsgDiv.innerHTML = `<strong>أنت:</strong> ${prompt}`;
        chatBox.appendChild(userMsgDiv);

        inputField.value = '';
        chatBox.scrollTop = chatBox.scrollHeight;

        const loadingDiv = document.createElement('div');
        loadingDiv.className = 'message ai-message';
        loadingDiv.id = 'loading';
        loadingDiv.innerHTML = `<strong>ضبع AI:</strong> يكتب الآن... ⏳`;
        chatBox.appendChild(loadingDiv);
        chatBox.scrollTop = chatBox.scrollHeight;

        try {
            const response = await fetch('/api/ai-chat', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ prompt: prompt })
            });

            const data = await response.json();
            
            const loadingElem = document.getElementById('loading');
            if (loadingElem) loadingElem.remove();

            const aiMsgDiv = document.createElement('div');
            aiMsgDiv.className = 'message ai-message';
            aiMsgDiv.innerHTML = `<strong>ضبع AI:</strong> ${data.response}`;
            chatBox.appendChild(aiMsgDiv);

        } catch (error) {
            const loadingElem = document.getElementById('loading');
            if (loadingElem) loadingElem.remove();

            const errorDiv = document.createElement('div');
            errorDiv.className = 'message ai-message';
            errorDiv.style.color = '#ef4444';
            errorDiv.innerHTML = `<strong>ضبع AI:</strong> عذراً، حدث خطأ أثناء الاتصال بالسيرفر.`;
            chatBox.appendChild(errorDiv);
        }

        chatBox.scrollTop = chatBox.scrollHeight;
    }

    function handleKeyPress(event) {
        if (event.key === 'Enter') {
            sendMessage();
        }
    }
</script>

</body>
</html>
